<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { width: 1080px; height: 1350px; font-family: 'Montserrat', Arial, sans-serif; background: #0b2545; color: #fff; overflow: hidden; }
  .card { position: relative; width: 100%; height: 100%; padding: 80px 80px 70px; display: flex; flex-direction: column;
    background: radial-gradient(circle at 85% 10%, #13427a 0%, #0b2545 55%, #071a33 100%); }
  /* contenedores decorativos */
  .stack { position: absolute; right: -40px; bottom: 230px; display: grid; grid-template-columns: repeat(3, 150px); gap: 10px; opacity: .16; transform: rotate(-8deg); }
  .stack div { height: 64px; border-radius: 6px; background: repeating-linear-gradient(90deg, #fff 0 6px, transparent 6px 22px); border: 4px solid #fff; }
  .tag { display: inline-block; align-self: flex-start; background: #ff7a00; color: #0b2545; font-weight: 800; font-size: 26px; letter-spacing: 3px; padding: 12px 26px; border-radius: 40px; text-transform: uppercase; }
  .kicker { margin-top: 56px; font-size: 34px; font-weight: 600; letter-spacing: 6px; color: #8fb8ff; text-transform: uppercase; }
  h1 { margin-top: 14px; font-size: 118px; line-height: .95; font-weight: 900; letter-spacing: -2px; }
  h1 span { color: #ff7a00; }
  .sub { margin-top: 22px; font-size: 32px; font-weight: 500; color: #d6e4ff; max-width: 820px; line-height: 1.35; }
  .info { margin-top: auto; display: grid; gap: 22px; position: relative; z-index: 1; }
  .row { display: flex; align-items: center; gap: 30px; background: rgba(255,255,255,.07); border: 2px solid rgba(255,255,255,.14); border-radius: 26px; padding: 26px 34px; }
  .ico { flex: none; width: 92px; height: 92px; border-radius: 22px; background: #ff7a00; display: grid; place-items: center; }
  .ico svg { width: 52px; height: 52px; stroke: #0b2545; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .lbl { font-size: 24px; font-weight: 700; letter-spacing: 3px; color: #8fb8ff; text-transform: uppercase; }
  .val { font-size: 46px; font-weight: 800; margin-top: 4px; line-height: 1.1; }
  .val small { display: block; font-size: 28px; font-weight: 600; color: #d6e4ff; margin-top: 4px; }
  .foot { margin-top: 34px; text-align: center; font-size: 26px; font-weight: 700; color: #0b2545; background: #ffd166; border-radius: 18px; padding: 20px; position: relative; z-index: 1; }
</style>
</head>
<body>
<div class="card">
  <div class="stack"><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div><div></div></div>

  <div class="tag">Honors Program 2026-II</div>
  <div class="kicker">Visita técnica</div>
  <h1>APM<br><span>Terminals</span><br>Callao</h1>
  <p class="sub">Puerto multipropósito, terminal de contenedores y aduanas marítimas.</p>

  <div class="info">
    <div class="row">
      <div class="ico"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></div>
      <div><div class="lbl">Fecha</div><div class="val">Jueves 26 de noviembre</div></div>
    </div>
    <div class="row">
      <div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg></div>
      <div><div class="lbl">Hora de la cita</div><div class="val">6:00 a.m.</div></div>
    </div>
    <div class="row">
      <div class="ico"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg></div>
      <div><div class="lbl">Punto de partida</div><div class="val">Puerta 3<small>Sede Lima Norte</small></div></div>
    </div>
  </div>

  <div class="foot">¡Sé puntual! Te esperamos a las 6:00 a.m. en Puerta 3.</div>
</div>
</body>
</html>
