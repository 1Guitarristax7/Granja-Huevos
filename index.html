<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Granja de Huevos — Control</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --primary:#2E7D32;--primary-light:#4CAF50;--primary-dark:#1B5E20;
  --accent:#F9A825;--accent-light:#FFF8E1;
  --bg:#F5F5F0;--surface:#FFF;--surface-alt:#FAFAF7;
  --text:#1A1A2E;--text-secondary:#5A5A6E;--text-light:#8A8A9E;
  --border:#E0E0D8;--danger:#D32F2F;--danger-light:#FFEBEE;
  --success:#2E7D32;--success-light:#E8F5E9;
  --warning:#F57F17;--warning-light:#FFF8E1;
  --info:#1565C0;--info-light:#E3F2FD;
  --shadow:0 1px 3px rgba(0,0,0,.08);--shadow-lg:0 4px 12px rgba(0,0,0,.12);
  --radius:8px;--radius-lg:12px;
  --sidebar-w:240px;
  --font:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
}
html,body{height:100%;font-family:var(--font);background:var(--bg);color:var(--text)}
a{color:var(--primary);text-decoration:none}
button{cursor:pointer;font-family:var(--font)}
input,select,textarea{font-family:var(--font);font-size:.9rem}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:var(--primary-dark);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s}
.sidebar-header{padding:20px;border-bottom:1px solid rgba(255,255,255,.1);display:flex;align-items:center;gap:12px}
.sidebar-header svg{width:32px;height:32px;fill:var(--accent)}
.sidebar-header h1{font-size:1.1rem;font-weight:600;line-height:1.2}
.sidebar-header small{font-size:.7rem;opacity:.7;display:block}
.sidebar-nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;color:rgba(255,255,255,.8);font-size:.9rem;transition:all .15s;border:none;background:none;width:100%;text-align:left}
.nav-item:hover{background:rgba(255,255,255,.1);color:#fff}
.nav-item.active{background:rgba(255,255,255,.15);color:#fff;font-weight:600;border-right:3px solid var(--accent)}
.nav-item svg{width:20px;height:20px;fill:currentColor;flex-shrink:0}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(255,255,255,.1);font-size:.75rem;opacity:.5;text-align:center}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.topbar h2{font-size:1.25rem;font-weight:600}
.topbar-actions{display:flex;gap:8px}
.content{flex:1;overflow-y:auto;padding:24px}
.menu-toggle{display:none;background:none;border:none;padding:8px;color:var(--text)}
.menu-toggle svg{width:24px;height:24px}

/* Cards & Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:var(--surface);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);border-left:4px solid var(--primary)}
.stat-card.accent{border-left-color:var(--accent)}
.stat-card.danger{border-left-color:var(--danger)}
.stat-card.info{border-left-color:var(--info)}
.stat-label{font-size:.8rem;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat-value{font-size:1.8rem;font-weight:700;line-height:1.2}
.stat-sub{font-size:.8rem;color:var(--text-light);margin-top:4px}

/* Tables */
.table-wrap{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.table-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.table-header h3{font-size:1rem;font-weight:600}
.table-filters{display:flex;gap:8px;flex-wrap:wrap}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{text-align:left;padding:12px 16px;background:var(--surface-alt);font-weight:600;color:var(--text-secondary);font-size:.75rem;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:10px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:hover td{background:var(--surface-alt)}
.empty-row td{text-align:center;color:var(--text-light);padding:40px 16px;font-style:italic}

/* Badges */
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:600}
.badge-pendiente{background:var(--warning-light);color:var(--warning)}
.badge-entregado{background:var(--success-light);color:var(--success)}
.badge-cancelado{background:var(--danger-light);color:var(--danger)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:var(--radius);font-size:.875rem;font-weight:500;border:1px solid transparent;transition:all .15s}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-dark)}
.btn-accent{background:var(--accent);color:#000}.btn-accent:hover{background:#e09100}
.btn-outline{background:transparent;color:var(--primary);border-color:var(--border)}.btn-outline:hover{background:var(--surface-alt)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#b71c1c}
.btn-sm{padding:5px 10px;font-size:.8rem}
.btn-icon{padding:6px;border-radius:6px;background:none;border:1px solid var(--border);color:var(--text-secondary)}.btn-icon:hover{background:var(--surface-alt);color:var(--text)}
.btn svg{width:16px;height:16px;fill:currentColor}

/* Forms */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.8rem;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input[type="text"],input[type="number"],input[type="date"],input[type="tel"],select,textarea{
  width:100%;padding:8px 12px;border:1px solid var(--border);border-radius:var(--radius);font-size:.9rem;background:var(--surface);transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(46,125,50,.15)}
textarea{resize:vertical;min-height:60px}
.input-sm{padding:6px 10px;font-size:.8rem}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column}
.modal-head{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:1.05rem;font-weight:600}
.modal-close{background:none;border:none;font-size:1.3rem;color:var(--text-light);padding:4px 8px}
.modal-body{padding:20px;overflow-y:auto;flex:1}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);color:#fff;font-size:.875rem;font-weight:500;box-shadow:var(--shadow-lg);animation:slideIn .3s ease}
.toast-success{background:var(--success)}.toast-error{background:var(--danger)}.toast-info{background:var(--info)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Chart */
.chart-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:24px}
.chart-card h3{font-size:1rem;font-weight:600;margin-bottom:16px}
canvas{width:100%!important;height:200px!important}

/* Quick form */
.quick-form{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:20px;margin-bottom:24px}
.quick-form h3{font-size:1rem;font-weight:600;margin-bottom:16px}
.quick-form .form-inline{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.quick-form .form-inline .form-group{margin-bottom:0;flex:1;min-width:120px}

/* Config banner */
.config-banner{background:var(--warning-light);border:1px solid var(--accent);border-radius:var(--radius-lg);padding:20px;margin-bottom:24px;text-align:center}
.config-banner h3{color:var(--warning);margin-bottom:8px}
.config-banner code{background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px;font-size:.85rem}

/* Section spacing */
.section-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-bottom:24px}
.section-grid.full{grid-template-columns:1fr}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:500;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:block}
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .section-grid{grid-template-columns:1fr}
  .quick-form .form-inline{flex-direction:column}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .content{padding:16px}
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <svg viewBox="0 0 32 32"><ellipse cx="16" cy="18" rx="10" ry="13" fill="#F9A825"/><ellipse cx="16" cy="16" rx="8" ry="11" fill="#FDD835"/></svg>
      <div><h1>Granja Huevos</h1><small>Sistema de Control</small></div>
    </div>
    <nav class="sidebar-nav" id="nav">
      <button class="nav-item active" data-page="dashboard">
        <svg viewBox="0 0 20 20"><path d="M10 2L2 7v11h6v-6h4v6h6V7l-8-5z"/></svg>Dashboard
      </button>
      <button class="nav-item" data-page="produccion">
        <svg viewBox="0 0 20 20"><ellipse cx="10" cy="11" rx="6" ry="8"/></svg>Produccion
      </button>
      <button class="nav-item" data-page="pedidos">
        <svg viewBox="0 0 20 20"><path d="M3 3h14l-2 9H5L3 3zm3 13a2 2 0 104 0 2 2 0 00-4 0zm8 0a2 2 0 104 0 2 2 0 00-4 0z"/></svg>Pedidos
      </button>
      <button class="nav-item" data-page="stock">
        <svg viewBox="0 0 20 20"><path d="M2 4h16v3H2zm1 4h14v9H3z"/></svg>Stock
      </button>
      <button class="nav-item" data-page="compras">
        <svg viewBox="0 0 20 20"><path d="M4 4h12l1 12H3zm2-2h8v2H6z"/></svg>Compras
      </button>
      <button class="nav-item" data-page="gastos">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="8"/><text x="10" y="14" text-anchor="middle" font-size="10" fill="#1B5E20" font-weight="bold">S/</text></svg>Gastos
      </button>
      <button class="nav-item" data-page="clientes">
        <svg viewBox="0 0 20 20"><circle cx="10" cy="6" r="4"/><path d="M2 18c0-4 4-7 8-7s8 3 8 7z"/></svg>Clientes
      </button>
      <button class="nav-item" data-page="lotes">
        <svg viewBox="0 0 20 20"><path d="M10 2c-2 0-3 1-3 2 0 2 1 3 3 4 2-1 3-2 3-4 0-1-1-2-3-2zm-5 8c-1.5 0-2.5 3-2.5 5s1 3 2.5 3 2.5-1 2.5-3-1-5-2.5-5zm10 0c-1.5 0-2.5 3-2.5 5s1 3 2.5 3 2.5-1 2.5-3-1-5-2.5-5z"/></svg>Lotes
      </button>
    </nav>
    <div class="sidebar-footer">Granja de Huevos v1.0</div>
  </aside>

  <!-- Main -->
  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>
        </button>
        <h2 id="page-title">Dashboard</h2>
      </div>
      <div class="topbar-actions" id="topbar-actions"></div>
    </div>
    <div class="content" id="content"></div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<!-- Toast container -->
<div class="toast-container" id="toasts"></div>

<script>
// ============================================================
// CONFIGURACION — Pon aqui tu URL y anon key de Supabase
// ============================================================
const SUPABASE_URL = 'https://evdqxycbvbwxspfqaqlg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KsJ9_QGCpwCdESwRQD6GiQ_TUDst98k';

const PRECIO_UNIDAD = 0.80;
const HUEVOS_POR_JABA = 30;
const PRECIO_JABA = PRECIO_UNIDAD * HUEVOS_POR_JABA;

// ============================================================
// SUPABASE CLIENT
// ============================================================
let db = null;
let isConnected = false;

function initSupabase() {
  if (!SUPABASE_URL || !SUPABASE_KEY) return false;
  try {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    isConnected = true;
    return true;
  } catch (e) {
    console.error('Error conectando a Supabase:', e);
    return false;
  }
}

// ============================================================
// UTILIDADES
// ============================================================
function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatMoney(n) {
  return 'S/ ' + Number(n || 0).toFixed(2);
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function toJabas(units) {
  const j = Math.floor(units / HUEVOS_POR_JABA);
  const r = units % HUEVOS_POR_JABA;
  return j > 0 ? `${j} jaba${j > 1 ? 's' : ''}${r > 0 ? ' + ' + r + ' ud.' : ''}` : `${units} ud.`;
}

function openModal(title, bodyHtml, footHtml) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-foot').innerHTML = footHtml;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function getFormData(formId) {
  const form = document.getElementById(formId);
  const data = {};
  form.querySelectorAll('input,select,textarea').forEach(el => {
    if (el.name) {
      if (el.type === 'number') data[el.name] = el.value === '' ? null : Number(el.value);
      else data[el.name] = el.value || null;
    }
  });
  return data;
}

// ============================================================
// ROUTER
// ============================================================
let currentPage = 'dashboard';

document.getElementById('nav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  navigateTo(item.dataset.page);
  document.getElementById('sidebar').classList.remove('open');
});

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  const titles = {
    dashboard: 'Dashboard', produccion: 'Produccion Diaria', pedidos: 'Pedidos',
    stock: 'Stock', compras: 'Compras de Insumos', gastos: 'Gastos',
    clientes: 'Clientes', lotes: 'Lotes de Gallinas'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  renderPage(page);
}

async function renderPage(page) {
  const c = document.getElementById('content');
  const a = document.getElementById('topbar-actions');
  a.innerHTML = '';

  if (!isConnected) {
    c.innerHTML = renderConfigBanner();
    return;
  }

  switch (page) {
    case 'dashboard': await renderDashboard(c, a); break;
    case 'produccion': await renderProduccion(c, a); break;
    case 'pedidos': await renderPedidos(c, a); break;
    case 'stock': await renderStock(c, a); break;
    case 'compras': await renderCompras(c, a); break;
    case 'gastos': await renderGastos(c, a); break;
    case 'clientes': await renderClientes(c, a); break;
    case 'lotes': await renderLotes(c, a); break;
  }
}

function renderConfigBanner() {
  return `<div class="config-banner">
    <h3>Configuracion Pendiente</h3>
    <p>Abre <code>index.html</code> y completa las variables <code>SUPABASE_URL</code> y <code>SUPABASE_KEY</code> con los datos de tu proyecto Supabase.</p>
    <p style="margin-top:12px">Luego ejecuta el archivo <code>supabase-schema.sql</code> en el SQL Editor de Supabase para crear las tablas.</p>
    <br>
    <p style="font-size:.85rem;color:var(--text-secondary)">Mientras tanto, puedes explorar la interfaz — los datos se cargaran al conectar.</p>
  </div>`;
}

// ============================================================
// DASHBOARD
// ============================================================
async function renderDashboard(c, a) {
  c.innerHTML = '<p style="color:var(--text-light)">Cargando...</p>';

  const [stockRes, prodHoy, pedPend, ingMes, gasMes, compMes, prod30] = await Promise.all([
    db.from('stock_actual').select('*').single(),
    db.from('produccion_diaria').select('cantidad_huevos').eq('fecha', today()),
    db.from('pedidos').select('total').eq('estado', 'pendiente'),
    db.from('pedidos').select('total').eq('estado', 'entregado').gte('fecha_pedido', today().slice(0, 7) + '-01'),
    db.from('gastos').select('monto').gte('fecha', today().slice(0, 7) + '-01'),
    db.from('compras').select('total').gte('fecha', today().slice(0, 7) + '-01'),
    db.from('produccion_diaria').select('fecha,cantidad_huevos').order('fecha', { ascending: true }).gte('fecha', new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0])
  ]);

  const stock = stockRes.data || { stock_disponible: 0, comprometido_pendiente: 0, total_producido_neto: 0, total_vendido: 0 };
  const hoy = (prodHoy.data || []).reduce((s, r) => s + r.cantidad_huevos, 0);
  const pendientes = pedPend.data || [];
  const ingresos = (ingMes.data || []).reduce((s, r) => s + Number(r.total), 0);
  const gastosTotal = (gasMes.data || []).reduce((s, r) => s + Number(r.monto), 0);
  const comprasTotal = (compMes.data || []).reduce((s, r) => s + Number(r.total), 0);
  const egresosTotal = gastosTotal + comprasTotal;

  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Stock Disponible</div>
        <div class="stat-value">${stock.stock_disponible || 0}</div>
        <div class="stat-sub">${toJabas(stock.stock_disponible || 0)}</div>
      </div>
      <div class="stat-card accent">
        <div class="stat-label">Produccion Hoy</div>
        <div class="stat-value">${hoy}</div>
        <div class="stat-sub">${toJabas(hoy)}</div>
      </div>
      <div class="stat-card info">
        <div class="stat-label">Pedidos Pendientes</div>
        <div class="stat-value">${pendientes.length}</div>
        <div class="stat-sub">${formatMoney(pendientes.reduce((s, r) => s + Number(r.total), 0))} por cobrar</div>
      </div>
      <div class="stat-card ${ingresos - egresosTotal >= 0 ? '' : 'danger'}">
        <div class="stat-label">Balance del Mes</div>
        <div class="stat-value">${formatMoney(ingresos - egresosTotal)}</div>
        <div class="stat-sub">Ingresos ${formatMoney(ingresos)} — Egresos ${formatMoney(egresosTotal)}</div>
      </div>
    </div>
    <div class="chart-card">
      <h3>Produccion Ultimos 30 Dias</h3>
      <canvas id="chart-prod"></canvas>
    </div>
  `;

  drawBarChart('chart-prod', (prod30.data || []).map(r => ({
    label: r.fecha.slice(5),
    value: r.cantidad_huevos
  })));
}

// ============================================================
// PRODUCCION
// ============================================================
async function renderProduccion(c, a) {
  a.innerHTML = '';

  const lotes = (await db.from('lotes_gallinas').select('id,nombre').eq('activo', true)).data || [];
  const loteOpts = lotes.map(l => `<option value="${l.id}">${l.nombre}</option>`).join('');

  const { data: rows } = await db.from('produccion_diaria')
    .select('*,lotes_gallinas(nombre)')
    .order('fecha', { ascending: false })
    .limit(60);

  c.innerHTML = `
    <div class="quick-form">
      <h3>Registrar Produccion</h3>
      <form id="frm-prod" class="form-inline" onsubmit="return false">
        <div class="form-group"><label>Fecha</label><input type="date" name="fecha" value="${today()}" required></div>
        <div class="form-group"><label>Huevos</label><input type="number" name="cantidad_huevos" min="0" required placeholder="0"></div>
        <div class="form-group"><label>Rotos</label><input type="number" name="huevos_rotos" min="0" value="0"></div>
        <div class="form-group"><label>Descartados</label><input type="number" name="huevos_descartados" min="0" value="0"></div>
        <div class="form-group"><label>Lote</label><select name="lote_id"><option value="">— Sin lote —</option>${loteOpts}</select></div>
        <div class="form-group"><label>Notas</label><input type="text" name="notas" placeholder="Opcional"></div>

function filterPedidos(btn, filter) {

    row.style.display = (filter === 'todos' || row.dataset.estado === filter) ? '' : 'none';
  });
}

  c.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Produccion Neta Total</div>
        <div class="stat-value">${s.total_producido_neto}</div>

async function editCliente(id) {

  if (id) {
    const { error } = await db.from('clientes').update(d).eq('id', id);
    if (error) return toast(error.message, 'error');
  } else {
    const { error } = await db.from('clientes').insert(d);

      <div class="form-row">

// ============================================================
// CHART — barra simple con Canvas
// ============================================================
function drawBarChart(canvasId, data) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !data.length) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width, h = rect.height;
  const pad = { top: 10, right: 10, bottom: 30, left: 40 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  const max = Math.max(...data.map(d => d.value), 1);
  const barW = Math.max(2, (cw / data.length) - 2);

  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = '#E0E0D8';
  ctx.lineWidth = 0.5;
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + ch - (ch * i / 4);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    ctx.fillStyle = '#8A8A9E';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(Math.round(max * i / 4), pad.left - 4, y + 3);
  }

  data.forEach((d, i) => {
    const x = pad.left + (i * (cw / data.length)) + 1;
    const barH = (d.value / max) * ch;
    const y = pad.top + ch - barH;

    const gradient = ctx.createLinearGradient(x, y, x, pad.top + ch);
    gradient.addColorStop(0, '#4CAF50');
    gradient.addColorStop(1, '#81C784');
    ctx.fillStyle = gradient;
    ctx.fillRect(x, y, barW, barH);

    if (data.length <= 31) {
      ctx.save();
      ctx.fillStyle = '#8A8A9E';
      ctx.font = '9px sans-serif';
      ctx.textAlign = 'center';
      ctx.translate(x + barW / 2, h - 4);
      ctx.rotate(-Math.PI / 4);
      ctx.fillText(d.label, 0, 0);
      ctx.restore();
    }
  });
}
