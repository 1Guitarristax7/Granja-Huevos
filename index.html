<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juanita & su Gallo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --tinta:#101822;--tinta-light:#1a2535;--tinta-lighter:#243044;
  --cyan-300:#6CDAE5;--cyan-400:#33C3D4;--cyan-500:#199FAC;--cyan-600:#0D7A85;--cyan-700:#065A63;
  --orange-300:#F0A360;--orange-400:#F08020;--orange-500:#D3680C;--orange-600:#A85000;
  --bg:#F0F4F8;--surface:#FFF;--surface-alt:#F7F9FB;
  --text:#101822;--text-secondary:#4A5568;--text-light:#8A94A6;
  --border:#E2E8F0;--border-light:#EDF2F7;
  --danger:#E53E3E;--danger-light:#FFF5F5;
  --success:#199FAC;--success-light:#E6FFFA;
  --warning:#F08020;--warning-light:#FFFAF0;
  --info:#199FAC;--info-light:#E6FFFA;
  --shadow:0 1px 3px rgba(16,24,34,.06),0 1px 2px rgba(16,24,34,.04);
  --shadow-md:0 4px 6px rgba(16,24,34,.07),0 2px 4px rgba(16,24,34,.04);
  --shadow-lg:0 10px 25px rgba(16,24,34,.1),0 4px 10px rgba(16,24,34,.05);
  --radius:10px;--radius-lg:14px;--radius-xl:20px;
  --sidebar-w:260px;
  --font-head:'Poppins',sans-serif;--font-body:'Inter',-apple-system,sans-serif;
}
html,body{height:100%;font-family:var(--font-body);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--cyan-500);text-decoration:none}
button{cursor:pointer;font-family:var(--font-body)}
input,select,textarea{font-family:var(--font-body);font-size:.9rem}
h1,h2,h3,h4{font-family:var(--font-head)}

/* Layout */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:var(--sidebar-w);background:linear-gradient(180deg,var(--tinta) 0%,var(--tinta-light) 100%);color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:transform .3s}
.sidebar-header{padding:24px 20px;border-bottom:1px solid rgba(108,218,229,.1);display:flex;align-items:center;gap:14px}
.sidebar-logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,var(--cyan-400),var(--orange-400));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-logo svg{width:28px;height:28px}
.sidebar-header h1{font-size:1.05rem;font-weight:700;line-height:1.3;font-family:var(--font-head)}
.sidebar-header h1 span{color:var(--orange-300)}
.sidebar-header small{font-size:.65rem;color:var(--cyan-300);display:block;font-weight:400;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.sidebar-nav{flex:1;padding:12px 0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.6);font-size:.875rem;font-weight:500;transition:all .2s;border:none;background:none;width:100%;text-align:left;border-left:3px solid transparent;font-family:var(--font-body)}
.nav-item:hover{background:rgba(108,218,229,.08);color:rgba(255,255,255,.9)}
.nav-item.active{background:rgba(108,218,229,.12);color:#fff;font-weight:600;border-left-color:var(--cyan-400)}
.nav-item svg{width:20px;height:20px;fill:currentColor;flex-shrink:0;opacity:.7}
.nav-item.active svg{opacity:1}
.sidebar-footer{padding:16px 20px;border-top:1px solid rgba(108,218,229,.1);text-align:center}
.sidebar-footer .jaba-ref{font-size:.7rem;color:var(--orange-300);font-weight:600;letter-spacing:.3px}
.sidebar-footer .jaba-ref span{color:var(--cyan-300)}
.sidebar-footer small{display:block;font-size:.65rem;color:rgba(255,255,255,.3);margin-top:6px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.topbar h2{font-size:1.2rem;font-weight:700;color:var(--tinta)}
.topbar-actions{display:flex;gap:8px}
.content{flex:1;overflow-y:auto;padding:28px}
.menu-toggle{display:none;background:none;border:none;padding:8px;color:var(--text)}
.menu-toggle svg{width:24px;height:24px}

/* Stat Cards */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin-bottom:28px}
.stat-card{background:var(--surface);border-radius:var(--radius-lg);padding:22px;box-shadow:var(--shadow);position:relative;overflow:hidden;transition:transform .2s,box-shadow .2s}
.stat-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--cyan-400),var(--cyan-500))}
.stat-card.accent::before{background:linear-gradient(90deg,var(--orange-300),var(--orange-400))}
.stat-card.danger::before{background:var(--danger)}
.stat-card.info::before{background:linear-gradient(90deg,var(--cyan-300),var(--cyan-500))}
.stat-label{font-size:.7rem;color:var(--text-light);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px;font-weight:600}
.stat-value{font-size:2rem;font-weight:800;line-height:1.1;font-family:var(--font-head);color:var(--tinta)}
.stat-sub{font-size:.8rem;color:var(--text-secondary);margin-top:6px;display:flex;align-items:center;gap:4px}
.stat-jaba{display:inline-flex;align-items:center;gap:4px;background:var(--warning-light);color:var(--orange-500);padding:2px 8px;border-radius:20px;font-size:.7rem;font-weight:600}

/* Tables */
.table-wrap{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);overflow:hidden}
.table-header{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-wrap:wrap;gap:8px}
.table-header h3{font-size:1rem;font-weight:700;color:var(--tinta)}
.table-filters{display:flex;gap:6px;flex-wrap:wrap}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.85rem}
th{text-align:left;padding:12px 16px;background:var(--surface-alt);font-weight:600;color:var(--text-light);font-size:.7rem;text-transform:uppercase;letter-spacing:.8px;white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:11px 16px;border-bottom:1px solid var(--border-light);vertical-align:middle}
tr:hover td{background:rgba(108,218,229,.03)}
.empty-row td{text-align:center;color:var(--text-light);padding:48px 16px;font-style:italic}

/* Badges */
.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.7rem;font-weight:600;letter-spacing:.3px}
.badge-pendiente{background:var(--warning-light);color:var(--orange-500)}
.badge-entregado{background:var(--success-light);color:var(--cyan-600)}
.badge-cancelado{background:var(--danger-light);color:var(--danger)}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 18px;border-radius:var(--radius);font-size:.85rem;font-weight:600;border:1px solid transparent;transition:all .2s}
.btn-primary{background:var(--cyan-500);color:#fff}.btn-primary:hover{background:var(--cyan-600);box-shadow:0 2px 8px rgba(25,159,172,.3)}
.btn-cta{background:var(--orange-400);color:var(--tinta);font-weight:700}.btn-cta:hover{background:var(--orange-500);color:#fff;box-shadow:0 2px 8px rgba(240,128,32,.3)}
.btn-outline{background:transparent;color:var(--cyan-500);border-color:var(--border)}.btn-outline:hover{background:var(--info-light);border-color:var(--cyan-400)}
.btn-danger{background:var(--danger);color:#fff}.btn-danger:hover{background:#c53030}
.btn-sm{padding:5px 12px;font-size:.78rem}
.btn-icon{padding:6px;border-radius:8px;background:none;border:1px solid var(--border-light);color:var(--text-light);transition:all .15s}.btn-icon:hover{background:var(--info-light);color:var(--cyan-500);border-color:var(--cyan-400)}
.btn svg{width:16px;height:16px;fill:currentColor}

/* Forms */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:.75rem;font-weight:600;color:var(--text-secondary);margin-bottom:5px;letter-spacing:.3px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
input[type="text"],input[type="number"],input[type="date"],input[type="tel"],select,textarea{
  width:100%;padding:9px 14px;border:1.5px solid var(--border);border-radius:var(--radius);font-size:.9rem;background:var(--surface);transition:all .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan-400);box-shadow:0 0 0 3px rgba(108,218,229,.15)}
textarea{resize:vertical;min-height:60px}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(16,24,34,.5);backdrop-filter:blur(4px);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);width:100%;max-width:560px;max-height:90vh;display:flex;flex-direction:column}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-head h3{font-size:1.05rem;font-weight:700;font-family:var(--font-head);color:var(--tinta)}
.modal-close{background:none;border:none;font-size:1.4rem;color:var(--text-light);padding:4px 8px;transition:color .15s}.modal-close:hover{color:var(--danger)}
.modal-body{padding:22px;overflow-y:auto;flex:1}
.modal-foot{padding:14px 22px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px}

/* Toast */
.toast-container{position:fixed;top:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px}
.toast{padding:12px 20px;border-radius:var(--radius);color:#fff;font-size:.85rem;font-weight:600;box-shadow:var(--shadow-lg);animation:slideIn .3s ease}
.toast-success{background:var(--cyan-600)}.toast-error{background:var(--danger)}.toast-info{background:var(--cyan-500)}
@keyframes slideIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}

/* Chart */
.chart-card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:22px;margin-bottom:28px}
.chart-card h3{font-size:1rem;font-weight:700;margin-bottom:4px;color:var(--tinta)}
.chart-card .chart-sub{font-size:.78rem;color:var(--text-light);margin-bottom:16px}
canvas{width:100%!important;height:220px!important}

/* Quick form */
.quick-form{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);padding:22px;margin-bottom:24px;border-top:3px solid var(--cyan-400)}
.quick-form h3{font-size:1rem;font-weight:700;margin-bottom:16px;color:var(--tinta)}
.quick-form .form-inline{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.quick-form .form-inline .form-group{margin-bottom:0;flex:1;min-width:120px}

/* Config banner */
.config-banner{background:linear-gradient(135deg,var(--tinta),var(--tinta-light));border-radius:var(--radius-xl);padding:32px;margin-bottom:24px;text-align:center;color:#fff}
.config-banner h3{color:var(--orange-300);margin-bottom:12px;font-size:1.2rem}
.config-banner p{color:rgba(255,255,255,.7);line-height:1.6}
.config-banner code{background:rgba(108,218,229,.15);color:var(--cyan-300);padding:2px 8px;border-radius:6px;font-size:.85rem}

/* Info strip */
.info-strip{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,rgba(108,218,229,.08),rgba(240,128,32,.06));border:1px solid rgba(108,218,229,.2);border-radius:var(--radius-lg);padding:14px 20px;margin-bottom:24px;flex-wrap:wrap}
.info-strip .info-item{display:flex;align-items:center;gap:6px;font-size:.82rem;font-weight:600;color:var(--tinta)}
.info-strip .info-item .num{color:var(--cyan-500);font-family:var(--font-head);font-size:1rem}
.info-strip .info-item .label{color:var(--text-secondary);font-weight:400}
.info-strip .divider{width:1px;height:24px;background:var(--border)}

/* Responsive */
@media(max-width:768px){
  .sidebar{position:fixed;left:0;top:0;bottom:0;z-index:500;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .menu-toggle{display:block}
  .stats-grid{grid-template-columns:1fr 1fr}
  .form-row,.form-row-3{grid-template-columns:1fr}
  .quick-form .form-inline{flex-direction:column}
  .content{padding:16px}
  .info-strip .divider{display:none}
}
@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo">
        <svg viewBox="0 0 32 32" fill="none">
          <ellipse cx="16" cy="20" rx="8" ry="10" fill="#FFF8E1"/>
          <ellipse cx="16" cy="19" rx="6.5" ry="8.5" fill="#FFE082"/>
          <path d="M14 10c0-2 1-4 2-4s2 2 2 4" fill="#E53E3E"/>
          <path d="M13 10.5c-.5-.5-1.5-.3-1.5.5s1 1 1.5.5z" fill="#E53E3E"/>
          <path d="M19 10.5c.5-.5 1.5-.3 1.5.5s-1 1-1.5.5z" fill="#E53E3E"/>
          <circle cx="14" cy="14" r="1" fill="#101822"/>
          <circle cx="18" cy="14" r="1" fill="#101822"/>
          <path d="M15 16.5c0 .3.5.5 1 .5s1-.2 1-.5" stroke="#F08020" stroke-width="1.2" stroke-linecap="round" fill="none"/>
          <path d="M14.5 17.5l16 18" stroke="#F08020" stroke-width=".8" fill="none"/>
        </svg>
      </div>
      <div><h1>Juanita <span>&</span> su Gallo</h1><small>Control Avicola</small></div>
    </div>
    <nav class="sidebar-nav" id="nav">
      <button class="nav-item active" data-page="dashboard">

      </button>

        <svg viewBox="0 0 20 20"><ellipse cx="10" cy="11" rx="6" ry="8"/></svg>Produccion

      </button>

      </button>

      </button>
      <button class="nav-item" data-page="lotes">
        <svg viewBox="0 0 20 20"><path d="M10 2c-2 0-3 1-3 2 0 2 1 3 3 4 2-1 3-2 3-4 0-1-1-2-3-2zm-5 8c-1.5 0-2.5 3-2.5 5s1 3 2.5 3 2.5-1 2.5-3-1-5-2.5-5zm10 0c-1.5 0-2.5 3-2.5 5s1 3 2.5 3 2.5-1 2.5-3-1-5-2.5-5z"/></svg>Lotes
      </button>
    </nav>
    <div class="sidebar-footer">
      <div class="jaba-ref">1 Jaba = <span>30</span> Huevos &bull; S/0.80/ud</div>
      <small>Juanita & su Gallo v2.0</small>
    </div>
  </aside>

  <div class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 6h18v2H3zm0 5h18v2H3zm0 5h18v2H3z"/></svg>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div class="toast-container" id="toasts"></div>

<script>
const SUPABASE_URL = 'https://evdqxycbvbwxspfqaqlg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_KsJ9_QGCpwCdESwRQD6GiQ_TUDst98k';

const PRECIO_UNIDAD = 0.80;
const HUEVOS_POR_JABA = 30;
const PRECIO_JABA = PRECIO_UNIDAD * HUEVOS_POR_JABA;

let db = null;
let isConnected = false;

function initSupabase() {
  if (!SUPABASE_URL || !SUPABASE_KEY) return false;
  try {
    db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    isConnected = true;
    return true;
  } catch (e) {
    console.error('Error conectando a Supabase:', e);
    return false;
  }
}

function toast(msg, type = 'success') {
  const el = document.createElement('div');
  el.className = `toast toast-${type}`;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

function formatDate(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString('es-PE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatMoney(n) {
  return 'S/ ' + Number(n || 0).toFixed(2);
}

function today() {
  return new Date().toISOString().split('T')[0];
}

function toJabas(units) {
  const j = Math.floor(units / HUEVOS_POR_JABA);
  const r = units % HUEVOS_POR_JABA;
  if (j > 0 && r > 0) return `${j} jaba${j > 1 ? 's' : ''} + ${r} ud.`;
  if (j > 0) return `${j} jaba${j > 1 ? 's' : ''} exactas`;
  return `${units} ud.`;
}

function jabasBadge(units) {
  const j = Math.floor(units / HUEVOS_POR_JABA);
  const r = units % HUEVOS_POR_JABA;
  if (units === 0) return '';
  let txt = j > 0 ? `${j} jaba${j > 1 ? 's' : ''}` : '';
  if (r > 0) txt += (txt ? ' + ' : '') + `${r} ud.`;
  return `<span class="stat-jaba">${txt}</span>`;
}

function openModal(title, bodyHtml, footHtml) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-body').innerHTML = bodyHtml;
  document.getElementById('modal-foot').innerHTML = footHtml;
  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
}

function getFormData(formId) {
  const form = document.getElementById(formId);
  const data = {};
  form.querySelectorAll('input,select,textarea').forEach(el => {
    if (el.name) {
      if (el.type === 'number') data[el.name] = el.value === '' ? null : Number(el.value);
      else data[el.name] = el.value || null;
    }
  });
  return data;
}

let currentPage = 'dashboard';

document.getElementById('nav').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if (!item) return;
  navigateTo(item.dataset.page);
  document.getElementById('sidebar').classList.remove('open');
});

function navigateTo(page) {
  currentPage = page;
  document.querySelectorAll('.nav-item').forEach(n => n.classList.toggle('active', n.dataset.page === page));
  const titles = {
    dashboard: 'Dashboard', produccion: 'Produccion Diaria', pedidos: 'Pedidos',
    stock: 'Stock', compras: 'Compras de Insumos', gastos: 'Gastos',
    clientes: 'Clientes', lotes: 'Lotes de Gallinas'
  };
  document.getElementById('page-title').textContent = titles[page] || page;
  renderPage(page);
}

async function renderPage(page) {
  const c = document.getElementById('content');
  const a = document.getElementById('topbar-actions');
  a.innerHTML = '';
  if (!isConnected) { c.innerHTML = renderConfigBanner(); return; }
  switch (page) {
    case 'dashboard': await renderDashboard(c, a); break;
    case 'produccion': await renderProduccion(c, a); break;
    case 'pedidos': await renderPedidos(c, a); break;
    case 'stock': await renderStock(c, a); break;
    case 'compras': await renderCompras(c, a); break;
    case 'gastos': await renderGastos(c, a); break;
    case 'clientes': await renderClientes(c, a); break;
    case 'lotes': await renderLotes(c, a); break;
  }
}

function renderConfigBanner() {
  return `<div class="config-banner">
    <h3>Configuracion Pendiente</h3>
    <p>Abre <code>index.html</code> y completa <code>SUPABASE_URL</code> y <code>SUPABASE_KEY</code>.</p>

async function renderDashboard(c, a) {
  c.innerHTML = '<p style="color:var(--text-light)">Cargando...</p>';

  const [stockRes, prodHoy, pedPend, ingMes, gasMes, compMes, prod30] = await Promise.all([
    db.from('stock_actual').select('*').single(),
    db.from('produccion_diaria').select('cantidad_huevos').eq('fecha', today()),
    db.from('pedidos').select('total').eq('estado', 'pendiente'),
    db.from('pedidos').select('total').eq('estado', 'entregado').gte('fecha_pedido', today().slice(0, 7) + '-01'),
    db.from('gastos').select('monto').gte('fecha', today().slice(0, 7) + '-01'),
    db.from('compras').select('total').gte('fecha', today().slice(0, 7) + '-01'),
    db.from('produccion_diaria').select('fecha,cantidad_huevos').order('fecha', { ascending: true }).gte('fecha', new Date(Date.now() - 30 * 86400000).toISOString().split('T')[0])
  ]);

  const stock = stockRes.data || { stock_disponible: 0, comprometido_pendiente: 0, total_producido_neto: 0, total_vendido: 0 };
  const hoy = (prodHoy.data || []).reduce((s, r) => s + r.cantidad_huevos, 0);
  const pendientes = pedPend.data || [];
  const ingresos = (ingMes.data || []).reduce((s, r) => s + Number(r.total), 0);
  const gastosTotal = (gasMes.data || []).reduce((s, r) => s + Number(r.monto), 0);
  const comprasTotal = (compMes.data || []).reduce((s, r) => s + Number(r.total), 0);
  const egresosTotal = gastosTotal + comprasTotal;
  const balance = ingresos - egresosTotal;

  c.innerHTML = `
    <div class="info-strip">
      <div class="info-item"><span class="num">1</span> jaba = <span class="num">30</span> <span class="label">huevos</span></div>
      <div class="divider"></div>
      <div class="info-item"><span class="label">Precio:</span> <span class="num">S/0.80</span> <span class="label">x ud.</span></div>
      <div class="divider"></div>
      <div class="info-item"><span class="label">Jaba:</span> <span class="num">S/24.00</span></div>
    </div>
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Stock Disponible</div>
        <div class="stat-value">${stock.stock_disponible || 0}</div>
        <div class="stat-sub">${jabasBadge(stock.stock_disponible || 0)}</div>
      </div>
      <div class="stat-card accent">
        <div class="stat-label">Produccion Hoy</div>
        <div class="stat-value">${hoy}</div>
        <div class="stat-sub">${jabasBadge(hoy)}</div>
      </div>
      <div class="stat-card info">
        <div class="stat-label">Pedidos Pendientes</div>
        <div class="stat-value">${pendientes.length}</div>
        <div class="stat-sub">${formatMoney(pendientes.reduce((s, r) => s + Number(r.total), 0))} por cobrar</div>
      </div>
      <div class="stat-card ${balance >= 0 ? '' : 'danger'}">
        <div class="stat-label">Balance del Mes</div>
        <div class="stat-value" style="color:${balance >= 0 ? 'var(--cyan-600)' : 'var(--danger)'}">${formatMoney(balance)}</div>
        <div class="stat-sub">Ingresos ${formatMoney(ingresos)} &mdash; Egresos ${formatMoney(egresosTotal)}</div>
      </div>
    </div>
    <div class="chart-card">
      <h3>Produccion Ultimos 30 Dias</h3>
      <div class="chart-sub">Huevos producidos por dia &bull; Las etiquetas muestran la cantidad exacta</div>
      <canvas id="chart-prod"></canvas>
    </div>
  `;

  drawBarChart('chart-prod', (prod30.data || []).map(r => ({
    label: r.fecha.slice(5),
    value: r.cantidad_huevos
  })));
}

async function saveProduccion() {
  const d = getFormData('frm-prod');
  if (!d.fecha || d.cantidad_huevos == null) return toast('Completa fecha y cantidad', 'error');
  d.huevos_rotos = d.huevos_rotos || 0;
  d.huevos_descartados = d.huevos_descartados || 0;
  if (!d.lote_id) delete d.lote_id;
  const { error } = await db.from('produccion_diaria').insert(d);
  if (error) return toast(error.message, 'error');
  toast('Produccion registrada');
  renderPage('produccion');
}

async function deleteProduccion(id) {
  if (!confirm('Eliminar este registro?')) return;
  await db.from('produccion_diaria').delete().eq('id', id);
  toast('Eliminado');
  renderPage('produccion');
}

function filterPedidos(btn, filter) {
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('tbody tr[data-estado]').forEach(row => {
    row.style.display = (filter === 'todos' || row.dataset.estado === filter) ? '' : 'none';
  });
}

      <div class="form-row">
        <div class="form-group"><label>Cliente</label><select name="cliente_id"><option value="">— Seleccionar —</option>${clienteOpts}</select></div>

async function savePedido(id) {

// ==================== CHART con etiquetas de datos ====================
function drawBarChart(canvasId, data) {
  const canvas = document.getElementById(canvasId);
  if (!canvas || !data.length) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * dpr;
  canvas.height = rect.height * dpr;
  ctx.scale(dpr, dpr);

  const w = rect.width, h = rect.height;
  const pad = { top: 28, right: 10, bottom: 36, left: 44 };
  const cw = w - pad.left - pad.right;
  const ch = h - pad.top - pad.bottom;
  const max = Math.max(...data.map(d => d.value), 1);
  const gap = 2;
  const barW = Math.max(4, (cw / data.length) - gap);

  ctx.clearRect(0, 0, w, h);

  ctx.strokeStyle = '#E2E8F0';
  ctx.lineWidth = 0.5;
  ctx.fillStyle = '#8A94A6';
  ctx.font = '10px Inter, sans-serif';
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const y = pad.top + ch - (ch * i / 4);
    ctx.beginPath(); ctx.moveTo(pad.left, y); ctx.lineTo(w - pad.right, y); ctx.stroke();
    ctx.fillText(Math.round(max * i / 4), pad.left - 6, y + 3);
  }

  data.forEach((d, i) => {
    const x = pad.left + (i * (cw / data.length)) + gap / 2;
    const barH = (d.value / max) * ch;
    const y = pad.top + ch - barH;

    const gradient = ctx.createLinearGradient(x, y, x, pad.top + ch);
    gradient.addColorStop(0, '#33C3D4');
    gradient.addColorStop(1, '#199FAC');
    ctx.fillStyle = gradient;

    const r = Math.min(barW / 2, 4);
    ctx.beginPath();
    ctx.moveTo(x, pad.top + ch);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.lineTo(x + barW - r, y);
    ctx.quadraticCurveTo(x + barW, y, x + barW, y + r);
    ctx.lineTo(x + barW, pad.top + ch);
    ctx.closePath();
    ctx.fill();

    // Etiqueta de datos encima de la barra
    if (d.value > 0) {
      ctx.fillStyle = '#101822';
      ctx.font = 'bold 10px Poppins, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(d.value, x + barW / 2, y - 6);
    }

    // Etiqueta del eje X
    if (data.length <= 31) {
      ctx.save();
      ctx.fillStyle = '#8A94A6';
      ctx.font = '9px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.translate(x + barW / 2, h - 4);
      ctx.rotate(-Math.PI / 5);
      ctx.fillText(d.label, 0, 0);
      ctx.restore();
    }
  });
}
